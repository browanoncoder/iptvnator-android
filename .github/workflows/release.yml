name: Release

# Push a tag that matches package.json, e.g. `npm version minor && git push --follow-tags`.
on:
    push:
        tags: ['v*.*.*']

permissions:
    contents: write

jobs:
    release:
        name: Signed release APK
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Client checkout location
              run: echo "IPTVNATOR_DIR=$RUNNER_TEMP/iptvnator" >> "$GITHUB_ENV"

            - name: Tag must match package.json
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
                      exit 1
                  fi
                  echo "VERSION=$version" >> "$GITHUB_ENV"

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
                  cache: gradle

            - run: pnpm install --frozen-lockfile
            - run: pnpm run typecheck
            - run: pnpm run test:unit
            - run: node scripts/build-client.mjs --checkout

            - name: Restore the release keystore
              env:
                  KEYSTORE_BASE64: ${{ secrets.IPTVNATOR_KEYSTORE_BASE64 }}
              run: |
                  if [ -z "$KEYSTORE_BASE64" ]; then
                      echo "::error::Repository secret IPTVNATOR_KEYSTORE_BASE64 is not set (see docs/RELEASING.md)"
                      exit 1
                  fi
                  echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
                  echo "IPTVNATOR_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

            - name: Build signed release APK
              env:
                  IPTVNATOR_KEYSTORE_PASSWORD: ${{ secrets.IPTVNATOR_KEYSTORE_PASSWORD }}
                  IPTVNATOR_KEY_ALIAS: ${{ secrets.IPTVNATOR_KEY_ALIAS }}
                  IPTVNATOR_KEY_PASSWORD: ${{ secrets.IPTVNATOR_KEY_PASSWORD }}
              run: pnpm run build:release

            - name: Verify signature and collect artifacts
              run: |
                  apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
                  "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
                  mkdir -p dist
                  cp android/app/build/outputs/apk/release/app-release.apk "dist/IPTVnator-Android-$VERSION.apk"
                  (cd dist && sha256sum *.apk > SHA256SUMS)
                  rm -f "$RUNNER_TEMP/release.keystore"

            - name: Release notes from CHANGELOG.md
              run: |
                  awk -v v="$VERSION" '
                      $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
                      found && /^## / { exit }
                      found { print }
                  ' CHANGELOG.md > dist/NOTES.md
                  test -s dist/NOTES.md || echo "IPTVnator for Android $VERSION" > dist/NOTES.md

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS \
                      --title "IPTVnator for Android $VERSION" \
                      --notes-file dist/NOTES.md
